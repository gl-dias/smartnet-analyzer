services:
  - type: web
    name: smartnet-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    autoDeployTrigger: commit
    # A versão do Python fica no arquivo .python-version.
    # Os valores são preenchidos no painel do Render: nenhum segredo fica neste arquivo.
    envVars:
      - key: AMBIENTE
        sync: false
      - key: APP_USUARIO
        sync: false
      - key: APP_SENHA_HASH
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PROXIES_CONFIAVEIS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
